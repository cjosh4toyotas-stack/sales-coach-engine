<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New MY27 · Knowledge Battle · Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C;
  --panel:#121216;
  --panel2:#17171C;
  --line:#232329;
  --text:#F2F2F4;
  --dim:#8A8A93;
  --red:#F2192E;
  --gold:#2A1013;
  --silver:#10161F;
  --bronze:#0E1A14;
  --goldline:#5A1B22;
  --silverline:#1F3050;
  --bronzeline:#1E4A33;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:64px 64px;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;background:rgba(0,0,0,.55);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;backdrop-filter:blur(6px);z-index:10;
}
.topbar .title{
  font-family:'Rajdhani',sans-serif;font-weight:600;
  letter-spacing:.28em;text-transform:uppercase;
  font-size:clamp(13px,2vw,20px);color:#E8E8EC;
  text-align:center;flex:1;
}
.live{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--red);border-radius:999px;
  padding:7px 16px;font-family:'Rajdhani',sans-serif;
  font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--red);
  white-space:nowrap;
}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}

.wrap{max-width:1400px;margin:0 auto;padding:40px 28px 120px}
.eyebrow{
  display:flex;align-items:center;gap:14px;
  font-family:'Rajdhani',sans-serif;font-weight:700;
  letter-spacing:.3em;font-size:13px;color:var(--red);
  text-transform:uppercase;margin-bottom:10px;
}
.eyebrow::before{content:"";width:38px;height:3px;background:var(--red)}
h1{
  font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:clamp(38px,6vw,64px);letter-spacing:.01em;
  margin-bottom:34px;
}
h1 span{color:var(--red)}

.board{display:grid;gap:14px}
.row{
  display:grid;
  grid-template-columns:64px 1fr minmax(140px,340px) 96px 120px 34px;
  align-items:center;gap:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 22px;
  transition:transform .15s ease;
}
.row:hover{transform:translateX(2px)}
.row.certified{background:rgba(22,163,74,.10);border-color:rgba(34,197,94,.40)}
.badge{
  display:inline-block;margin-left:10px;padding:3px 10px;border-radius:999px;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;vertical-align:middle;
}
.badge.ok{color:#4ADE80;border:1px solid rgba(74,222,128,.5)}
.badge.no{color:#F87171;border:1px solid rgba(248,113,113,.4)}
.req{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-left:4px solid #22C55E;
  border-radius:10px;padding:14px 18px;margin-bottom:24px;
  font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.08em;font-size:16px;
}
.req .lbl{text-transform:uppercase;color:#4ADE80}
.req input{
  width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--text);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;
  text-align:center;padding:6px 4px;
}
.req input:focus{outline:2px solid #22C55E;outline-offset:-1px}
.req .pct{color:var(--dim);font-size:14px}
.rank{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px;
  color:var(--dim);text-align:center;
}
.rank .medal{font-size:28px;display:block;line-height:1}
.who .name{font-weight:700;font-size:19px;letter-spacing:.01em}
.who .dealer{font-size:13px;color:var(--dim);margin-top:2px}
.meter{background:#232329;height:6px;border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:3px;box-shadow:0 0 12px rgba(242,25,46,.55)}
.score{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px;
  text-align:right;white-space:nowrap;
}
.score small{font-size:15px;color:var(--dim);font-weight:600}
.meta{font-size:12.5px;color:var(--dim);text-align:right;line-height:1.5}
.del{
  background:none;border:none;color:#3A3A42;font-size:18px;cursor:pointer;
  line-height:1;padding:4px;border-radius:6px;
}
.del:hover{color:var(--red);background:rgba(242,25,46,.08)}
.del:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.empty{
  text-align:center;color:var(--dim);padding:60px 20px;
  border:1px dashed var(--line);border-radius:10px;
  font-family:'Rajdhani',sans-serif;letter-spacing:.12em;text-transform:uppercase;
}

.controls{
  position:fixed;left:0;right:0;bottom:0;
  background:rgba(8,8,10,.92);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:16px 28px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;
}
.controls input{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;
  padding:12px 16px;min-width:0;
}
.controls input::placeholder{color:#5A5A64}
.controls input:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
#f-name{flex:2 1 200px}
#f-dealer{flex:2 1 200px}
#f-score{flex:1 1 90px;max-width:110px}
#f-attempts{flex:1 1 90px;max-width:110px}
#f-time{flex:1 1 100px;max-width:120px}
.btn{
  border:none;border-radius:8px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.06em;padding:12px 22px;white-space:nowrap;
}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn-add{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(242,25,46,.45)}
.btn-add:hover{background:#FF2B40}
.btn-clear{background:#1C1C22;color:var(--text);border:1px solid var(--line)}
.btn-clear:hover{border-color:#3A3A42}

@media(max-width:820px){
  .row{grid-template-columns:44px 1fr 84px 30px;gap:12px;padding:16px}
  .meter{display:none}
  .meta{display:none}
  .rank{font-size:22px}
  .rank .medal{font-size:22px}
  .who .name{font-size:16px}
  .score{font-size:24px}
  .wrap{padding:28px 16px 170px}
}
</style>
</head>
<body>

<div class="topbar">
  <div style="width:120px"></div>
  <div class="title">What's New MY27 &nbsp;·&nbsp; Phase 4 &nbsp;·&nbsp; Knowledge Battle</div>
  <div class="live"><span class="dot"></span>LIVE SESSION</div>
</div>

<div class="wrap">
  <div class="eyebrow">Knowledge Battle &nbsp;·&nbsp; Live Results</div>
  <h1>Session <span>Leaderboard</span></h1>
  <div class="req">
    <span class="lbl">Certification Requirement</span>
    <span><input id="f-thresh" type="number" min="1" max="30" aria-label="Certification threshold score"> / 30</span>
    <span class="pct" id="req-pct"></span>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="controls">
  <input id="f-name" type="text" placeholder="Name" aria-label="Name">
  <input id="f-dealer" type="text" placeholder="Dealership" aria-label="Dealership" value="McGrath Toyota of Iowa City">
  <input id="f-score" type="number" min="0" max="30" placeholder="Score" aria-label="Score out of 30">
  <input id="f-attempts" type="number" min="1" placeholder="Attempts" aria-label="Attempts">
  <input id="f-time" type="text" placeholder="Time 1m 44s" aria-label="Time">
  <button class="btn btn-add" id="btn-add">+ Add Score</button>
  <button class="btn btn-clear" id="btn-clear">Clear All</button>
</div>

<script>
(function(){
  var MAX = 30;
  var KEY = "my27_kb_leaderboard_v1";
  var thresh = 24; // certification requirement, editable in the banner

  // Guarded storage: persists in the browser when hosted; falls back to memory otherwise.
  var mem = null;
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(Array.isArray(d)) return {rows:d, thresh:thresh};   // old format
        return d;
      }
    }catch(e){}
    return mem;
  }
  function save(){
    var d = {rows:rows, thresh:thresh};
    mem = d;
    try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
  }

  var seed = [
    {name:"Tyler Hemphill",   dealer:"McGrath Toyota of Iowa City", score:30, attempts:3, secs:104},
    {name:"Hunter Schmitt",   dealer:"McGrath Toyota of Iowa City", score:30, attempts:4, secs:141},
    {name:"Hunter Robertson", dealer:"McGrath Toyota of Iowa City", score:28, attempts:2, secs:495},
    {name:"Mike Wells",       dealer:"McGrath Toyota of Iowa City", score:22, attempts:2, secs:272},
    {name:"Nikki Elledge",    dealer:"McGrath Toyota of Iowa City", score:20, attempts:2, secs:227},
    {name:"Jack Osland",      dealer:"McGrath Toyota of Iowa City", score:16, attempts:1, secs:425},
    {name:"Noah Fried",       dealer:"McGrath Toyota of Iowa City", score:12, attempts:1, secs:194}
  ];

  var saved = load();
  var rows;
  if(saved){ rows = saved.rows; if(saved.thresh) thresh = saved.thresh; }
  else { rows = seed.slice(); save(); }

  function parseTime(str){
    if(!str) return null;
    str = String(str).trim().toLowerCase();
    var m = str.match(/^(\d+)\s*m(?:in)?\s*(\d+)?\s*s?(?:ec)?$/);   // "1m 44s", "1m", "1min 44"
    if(m) return (+m[1])*60 + (m[2]? +m[2] : 0);
    var c = str.match(/^(\d+):(\d{1,2})$/);                          // "1:44"
    if(c) return (+c[1])*60 + (+c[2]);
    var s = str.match(/^(\d+)\s*s(?:ec)?s?$/);                       // "95s"
    if(s) return +s[1];
    if(/^\d+$/.test(str)) return +str;                               // bare seconds
    return null;
  }
  function fmtTime(secs){
    if(secs == null) return "";
    var m = Math.floor(secs/60), s = secs % 60;
    return m > 0 ? (m + "m " + s + "s") : (s + "s");
  }

  function sorted(){
    return rows.slice().sort(function(a,b){
      if(b.score !== a.score) return b.score - a.score;
      var at = a.secs == null ? Infinity : a.secs;
      var bt = b.secs == null ? Infinity : b.secs;
      if(at !== bt) return at - bt;
      return (a.attempts||99) - (b.attempts||99);
    });
  }

  var medals = ["\uD83E\uDD47","\uD83E\uDD48","\uD83E\uDD49"];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function render(){
    var board = document.getElementById("board");
    var ti = document.getElementById("f-thresh");
    if(document.activeElement !== ti) ti.value = thresh;
    document.getElementById("req-pct").textContent =
      Math.round((thresh / MAX) * 100) + "% required to certify";
    var list = sorted();
    if(list.length === 0){
      board.innerHTML = '<div class="empty">No scores yet — add the first result below</div>';
      return;
    }
    board.innerHTML = list.map(function(r, i){
      var pos = i + 1;
      var certified = r.score >= thresh;
      var cls = certified ? "certified" : "";
      var style = "";
      if(!certified){
        // Fade from orange near the requirement down to red at the bottom
        var ratio = Math.max(0, Math.min(1, r.score / thresh));
        var hue = Math.round(35 * ratio);
        style = ' style="background:hsla(' + hue + ',75%,45%,.10);border-color:hsla(' + hue + ',75%,55%,.35)"';
      }
      var rank = pos <= 3
        ? '<span class="medal">' + medals[pos-1] + '</span>'
        : pos;
      var pct = Math.max(4, Math.round((r.score / MAX) * 100));
      var badge = certified
        ? '<span class="badge ok">Certified</span>'
        : '<span class="badge no">' + (thresh - r.score) + ' to go</span>';
      var meta = [];
      if(r.attempts) meta.push(r.attempts + (r.attempts === 1 ? " attempt" : " attempts"));
      if(r.secs != null) meta.push(fmtTime(r.secs));
      return '<div class="row ' + cls + '"' + style + '>' +
        '<div class="rank">' + rank + '</div>' +
        '<div class="who"><div class="name">' + esc(r.name) + badge + '</div><div class="dealer">' + esc(r.dealer||"") + '</div></div>' +
        '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
        '<div class="score">' + r.score + '<small>/' + MAX + '</small></div>' +
        '<div class="meta">' + meta.join("<br>") + '</div>' +
        '<button class="del" data-i="' + rows.indexOf(r) + '" title="Remove ' + esc(r.name) + '" aria-label="Remove ' + esc(r.name) + '">&times;</button>' +
      '</div>';
    }).join("");
  }

  document.getElementById("f-thresh").addEventListener("input", function(){
    var v = parseInt(this.value, 10);
    if(!isNaN(v) && v >= 1 && v <= MAX){
      thresh = v;
      save(); render();
    }
  });

  document.getElementById("board").addEventListener("click", function(e){
    var btn = e.target.closest(".del");
    if(!btn) return;
    var idx = +btn.getAttribute("data-i");
    rows.splice(idx, 1);
    save(rows); render();
  });

  function addEntry(){
    var name = document.getElementById("f-name").value.trim();
    var dealer = document.getElementById("f-dealer").value.trim();
    var score = parseInt(document.getElementById("f-score").value, 10);
    var attempts = parseInt(document.getElementById("f-attempts").value, 10);
    var secs = parseTime(document.getElementById("f-time").value);
    if(!name || isNaN(score)) return;
    score = Math.max(0, Math.min(MAX, score));
    rows.push({
      name:name, dealer:dealer, score:score,
      attempts:isNaN(attempts)? null : attempts,
      secs:secs
    });
    save(rows); render();
    document.getElementById("f-name").value = "";
    document.getElementById("f-score").value = "";
    document.getElementById("f-attempts").value = "";
    document.getElementById("f-time").value = "";
    document.getElementById("f-name").focus();
  }

  document.getElementById("btn-add").addEventListener("click", addEntry);
  document.querySelector(".controls").addEventListener("keydown", function(e){
    if(e.key === "Enter") addEntry();
  });
  document.getElementById("btn-clear").addEventListener("click", function(){
    if(confirm("Clear all scores from the leaderboard?")){
      rows = [];
      save(rows); render();
    }
  });

  render();
})();
</script>
</body>
</html>
